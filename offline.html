<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <meta name="robots" content="noindex,nofollow">
  <title>Offline — ASLCODER Warehouse</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef3f9,#f8fafc);font-family:Inter,Segoe UI,Arial,sans-serif;color:#17212b}.card{width:min(520px,100%);padding:32px;border:1px solid #d9e0e6;border-radius:26px;background:#fff;box-shadow:0 25px 70px rgba(15,23,42,.12);text-align:center}.icon{width:76px;height:76px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:#eef4ff;font-size:36px}.card h1{margin:0 0 8px;font-size:30px}.card p{margin:0 auto 22px;max-width:410px;line-height:1.65;color:#66727e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions button,.actions a{min-height:46px;border-radius:11px;border:1px solid #d0d7df;background:#fff;color:#2457a6;text-decoration:none;font-weight:800;display:grid;place-items:center;cursor:pointer}.actions button.primary{background:#2457a6;color:#fff;border-color:#2457a6}@media(max-width:520px){.card{padding:24px}.actions{grid-template-columns:1fr}.card h1{font-size:26px}}
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📡</div>
    <h1>Aloqa vaqtincha yo‘q</h1>
    <p>ASLCODER Warehouse hozir offline rejimda. Internet qaytgach sahifani yangilang. Maxfiy ombor ma’lumotlari offline keshga saqlanmaydi.</p>
    <div class="actions">
      <button class="primary" onclick="location.reload()">↻ Qayta urinish</button>
      <a href="./">⌂ Bosh sahifa</a>
    </div>
  </main>
</body>
</html>
